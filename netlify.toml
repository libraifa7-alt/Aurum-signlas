[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Run the server-side ICT scanner every five minutes on published deploys.
[functions."aurum-scheduler"]
  schedule = "*/5 * * * *"

# Keep API URLs identical across Vercel, Cloudflare Pages, and Netlify.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/aurum-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/aurum-api/:splat"
  status = 200
  force = true

# Client-side application routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
