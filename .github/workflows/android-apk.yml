name: Build Signature Trading Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/signature-traxa-opening
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
      - 'public/**'

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/splash-screen@7

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web application
        run: npx cap sync android

      - name: Remove Android white launch flash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('android/app/src/main/res').rglob('styles.xml'):
              source = path.read_text()
              updated = source.replace('<item name="android:background">@drawable/splash</item>', '<item name="android:background">#080808</item>')
              marker = '<style name="AppTheme.NoActionBarLaunch"'
              if marker in updated:
                  start = updated.index(marker)
                  end = updated.index('</style>', start)
                  block = updated[start:end]
                  if 'windowSplashScreenBackground' not in block:
                      block += '\\n        <item name="windowSplashScreenBackground">#080808</item>'
                  if 'windowSplashScreenAnimatedIcon' not in block:
                      block += '\\n        <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>'
                  updated = updated[:start] + block + updated[end:]
              if updated != source:
                  path.write_text(updated)
                  print(f'Patched {path}')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: signature-trading-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
