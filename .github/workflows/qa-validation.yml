name: AURUM QA validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [qa/yahoo-candle-freshness]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check API and alternate-host syntax
        run: |
          node --check api/index.js
          node --check server.js
      - name: Check Cloudflare Pages function syntax
        run: |
          node --input-type=module --check < functions/api.js
          node --input-type=module --check < functions/api/health.js
      - name: Smoke test Cloudflare Pages adapter
        run: |
          npx --yes wrangler@4 pages dev ./public --ip 127.0.0.1 --port 8788 > /tmp/aurum-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8788/api/health > /tmp/aurum-health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/aurum-pages.log
            exit 1
          fi
          node -e "const h=require('/tmp/aurum-health.json'); if(h.api!=='mounted'||h.host!=='Cloudflare Pages') process.exit(1)"
          code=$(curl --silent --output /tmp/aurum-invalid.json --write-out '%{http_code}' 'http://127.0.0.1:8788/api?symbol=XAU%2FUSD&interval=INVALID')
          test "$code" = "400"
          node -e "const d=require('/tmp/aurum-invalid.json'); if(d.code!=='INVALID_INTERVAL') process.exit(1)"
      - name: Run Gold fallback regression tests
        run: npm test
      - name: Check inline browser JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { spawnSync } = require('node:child_process');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
            .map(match => match[2]);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((source, index) => {
            const file = path.join(os.tmpdir(), `aurum-inline-${index}.js`);
            fs.writeFileSync(file, source);
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write(result.stderr || result.stdout);
              process.exit(result.status || 1);
            }
          });
          console.log(`Validated API syntax and ${scripts.length} inline script blocks.`);
          NODE
