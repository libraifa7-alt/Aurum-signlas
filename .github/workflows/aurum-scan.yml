name: AURUM Signal Scanner
# Hobby-safe scanner: one scheduled run per day; manual dispatch remains available.

on:
  push:
    paths:
      - '.github/workflows/aurum-scan.yml'
      - 'api/cron.js'
      - 'api/engine.js'
      - 'api/index.js'
      - 'api/signals.js'
      - 'api/push-subscribe.js'
      - 'public/index.html'
      - 'public/sw.js'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-side market scan
        env:
          AURUM_URL: https://aurum-signals-ai.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Repository secret CRON_SECRET belum diatur."
            exit 1
          fi
          response=$(curl --silent --show-error --max-time 120 \
            -w '\nHTTP_STATUS:%{http_code}' \
            -X POST "$AURUM_URL/api/cron" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json")
          curl_exit=$?
          printf '%s\n' "$response"
          if [ "$curl_exit" -ne 0 ]; then exit "$curl_exit"; fi
          http_status="${response##*HTTP_STATUS:}"
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "Server scan gagal dengan HTTP $http_status"
            exit 1
          fi

          signals=$(curl --silent --show-error --fail --max-time 30 \
            -H "Accept: application/json" "$AURUM_URL/api/signals")
          printf '%s\n' "$signals"
          printf '%s' "$signals" | jq -e '
            .status == "success" and
            (.results | length == 3) and
            all(.results[]; (.symbol != null) and has("current") and has("history"))
          ' >/dev/null
          echo "API signals smoke test: OK (3 instruments)"

